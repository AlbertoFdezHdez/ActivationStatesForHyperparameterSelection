experiment_id: c4_mobilenetv2_food101
runner: cnns
model:
  name: mobilenet_v2
  pretrained: false
data:
  name: food101
  loader: torchvision
  data_dir: null
  env_var: FOOD101_ROOT
  download: true
  num_classes: 101
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  split_description: torchvision Food101 train/test
training:
  epochs: 80
  effective_batch_size: 256
  per_device_batch_size: 64
  learning_rates: [1e-4, 3e-4, 1e-3, 3e-3]
  weight_decays: [0.0, 1e-4, 1e-3, 1e-2]
  seeds: [0, 1, 2]
  warmup_fraction: 0.05
  label_smoothing: 0.1
  num_workers: 8
tracking:
  oui_probe_every_metric_steps: 1
smoke:
  training:
    epochs: 1
    max_steps: 30
    effective_batch_size: 64
    per_device_batch_size: 32
    num_workers: 2
  data:
    smoke_train_examples: 256
    smoke_val_examples: 128
  tracking:
    validation_max_batches: 2
    oui_probe_every_metric_steps: 1
