experiment_id: p1_llama_c4
runner: pretraining
task_type: causal_lm
model:
  family: llama
  init: scratch
  tokenizer:
    name: gpt2
  config:
    hidden_size: 512
    intermediate_size: 1376
    num_hidden_layers: 8
    num_attention_heads: 8
    num_key_value_heads: 8
    max_position_embeddings: 512
    rms_norm_eps: 1.0e-6
dataset:
  name: allenai/c4
  config: en
  train_split: train
  validation_split: validation
  validation_subset_size: 4096
  text_columns: [text]
  streaming: true
  shuffle_buffer: 10000
training:
  betas: [0.95, 0.95]
  learning_rates: [1.0e-4, 3.0e-4, 8.0e-4, 2.0e-3]
  weight_decays: [0.0, 1.0e-2, 3.0e-2, 1.0e-1]
  seeds: [0, 1, 2]
  max_steps: 30000
  batch_size: 8
  gradient_accumulation_steps: 8
  sequence_length: 512
  scheduler: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  gradient_clip: 1.0
  precision: auto
  log_every: 30
validation:
  eval_every: 1500
  batch_size: 8
oui:
  hook_patterns: [gate_proj]
  sequence_mode: last_token
  measure_every: 30
  probe_size: 8
  probe_batch_size: 8
  max_token_samples: 256
  save_probe_batches: false
output:
  results_root: ../../descargas/transformers_nlp_supervised/results
  save_final_checkpoint: false
smoke:
  output:
    save_final_checkpoint: false
  training:
    max_steps: 120
    batch_size: 2
    gradient_accumulation_steps: 1
    sequence_length: 128
    log_every: 30
  validation:
    eval_every: 1500
    batch_size: 2
    max_batches: 1
  oui:
    measure_every: 30
    probe_size: 2
    probe_batch_size: 2
    max_token_samples: 128
