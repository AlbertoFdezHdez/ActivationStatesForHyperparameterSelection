experiment_id: v3_mobilevit_xs_pets
runner: vits
model:
  name: mobilevit_xs
  pretrained: true
data:
  name: oxford_iiit_pet
  loader: torchvision
  data_dir: null
  download: true
  num_classes: 37
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  split_description: torchvision OxfordIIITPet trainval/test
training:
  epochs: 60
  effective_batch_size: 128
  per_device_batch_size: 32
  learning_rates: [1e-5, 3e-5, 1e-4, 3e-4]
  weight_decays: [0.0, 1e-3, 1e-2, 5e-2]
  seeds: [0, 1, 2]
  warmup_fraction: 0.05
  label_smoothing: 0.1
  num_workers: 8
tracking:
  oui_probe_every_metric_steps: 1
smoke:
  training:
    epochs: 1
    max_steps: 30
    effective_batch_size: 64
    per_device_batch_size: 16
    num_workers: 2
  data:
    smoke_train_examples: 256
    smoke_val_examples: 128
  tracking:
    validation_max_batches: 2
    oui_probe_every_metric_steps: 1
