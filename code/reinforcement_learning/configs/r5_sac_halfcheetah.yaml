  target_update_interval: 1
tracking:
  probe_states: 2048
  eval_episodes: 5
oui_patterns: []
smoke:
  training:
    total_timesteps: 10000
  hyperparams:
    learning_starts: 100
    buffer_size: 50000
  tracking:
    probe_states: 256
    eval_episodes: 2
